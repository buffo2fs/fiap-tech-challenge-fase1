openapi: 3.1.0
info:
  title: Restaurant Management API
  description: |
    User management API for a shared restaurant management system.
    Support customers and restaurants owners: registration, search by name, profile update,
    password change, soft delete and login validation.
    Errors follow RFC 7807 (ProblemDetail).
  version: v1
servers:
- url: http://localhost:8080
  description: Generated server url
paths:
  /api/v1/users/{id}:
    get:
      tags:
      - user-controller
      operationId: findById
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/UserResponse"
    put:
      tags:
      - user-controller
      operationId: update
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateUserRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/UserResponse"
    delete:
      tags:
      - user-controller
      operationId: delete
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "200":
          description: OK
  /api/v1/users:
    get:
      tags:
      - user-controller
      operationId: searchByName
      parameters:
      - name: name
        in: query
        required: true
        schema:
          type: string
          minLength: 1
      - name: pageable
        in: query
        required: true
        schema:
          $ref: "#/components/schemas/Pageable"
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/PageResponseUserResponse"
    post:
      tags:
      - user-controller
      operationId: create
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateUserRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/UserResponse"
  /api/v1/auth/login:
    post:
      tags:
      - auth-controller
      operationId: login
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/LoginResponse"
  /api/v1/users/{id}/password:
    patch:
      tags:
      - user-controller
      operationId: changePassword
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChangePasswordRequest"
        required: true
      responses:
        "200":
          description: OK
components:
  schemas:
    AddressRequest:
      type: object
      properties:
        street:
          type: string
          description: Street name
          example: Rua dos Gatos
          maxLength: 150
          minLength: 0
        number:
          type: string
          description: Street number
          example: "123"
          maxLength: 20
          minLength: 0
        city:
          type: string
          description: City name
          example: São Paulo
          maxLength: 100
          minLength: 0
        zipCode:
          type: string
          description: ZIP code
          example: 01310-100
          minLength: 1
          pattern: "\\d{5}-?\\d{3}"
      required:
      - city
      - number
      - street
      - zipCode
    UpdateUserRequest:
      type: object
      properties:
        name:
          type: string
          description: User's full name
          example: John Doe
          maxLength: 150
          minLength: 0
        email:
          type: string
          format: email
          description: User's email address
          example: john.doe@example.com
          maxLength: 255
          minLength: 0
        login:
          type: string
          description: User's login
          example: Jhon.Doe
          maxLength: 50
          minLength: 3
        address:
          $ref: "#/components/schemas/AddressRequest"
          description: User's address
          example: 123
      required:
      - address
      - email
      - login
      - name
    AddressResponse:
      type: object
      properties:
        street:
          type: string
        number:
          type: string
        city:
          type: string
        zipCode:
          type: string
    UserResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        email:
          type: string
        login:
          type: string
        type:
          type: string
          enum:
          - CUSTOMER
          - RESTAURANT_OWNER
        address:
          $ref: "#/components/schemas/AddressResponse"
        lastModifiedAt:
          type: string
          format: date-time
    CreateUserRequest:
      type: object
      properties:
        name:
          type: string
          description: User's full name
          example: John Doe
          maxLength: 150
          minLength: 0
        email:
          type: string
          format: email
          description: User's email address
          example: john.doe@example.com
          maxLength: 255
          minLength: 0
        login:
          type: string
          description: User's login
          example: Jhon.Doe
          maxLength: 50
          minLength: 3
        password:
          type: string
          description: User's password
          example: SecurePass123
          maxLength: 72
          minLength: 8
        type:
          type: string
          description: User's type
          enum:
          - CUSTOMER
          - RESTAURANT_OWNER
          example: CUSTOMER
        address:
          $ref: "#/components/schemas/AddressRequest"
          description: User's address
      required:
      - address
      - email
      - login
      - name
      - password
      - type
    LoginRequest:
      type: object
      properties:
        login:
          type: string
          description: User's login
          example: Jhon.Doe
          minLength: 1
        password:
          type: string
          description: User's password
          example: Secure@123
          minLength: 1
      required:
      - login
      - password
    LoginResponse:
      type: object
      properties:
        message:
          type: string
        user:
          $ref: "#/components/schemas/UserResponse"
    ChangePasswordRequest:
      type: object
      properties:
        currentPassword:
          type: string
          description: Current password
          example: Secure@123
          minLength: 1
        newPassword:
          type: string
          description: New password
          example: NewSecure@456
          maxLength: 72
          minLength: 8
      required:
      - currentPassword
      - newPassword
    Pageable:
      type: object
      properties:
        page:
          type: integer
          format: int32
          minimum: 0
        size:
          type: integer
          format: int32
          minimum: 1
        sort:
          type: array
          items:
            type: string
    PageResponseUserResponse:
      type: object
      properties:
        content:
          type: array
          items:
            $ref: "#/components/schemas/UserResponse"
        page:
          type: integer
          format: int32
        size:
          type: integer
          format: int32
        totalElements:
          type: integer
          format: int64
        totalPages:
          type: integer
          format: int32
