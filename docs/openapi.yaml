openapi: 3.1.0
info:
  title: Restaurant Management API
  description: |-
    User management API for a shared restaurant management system.
    Supports customers and restaurant owners: registration, search by name,
    profile update, password change, soft delete and login validation.
    Protected endpoints require a JWT: call POST /api/v1/auth/login,
    then click Authorize and paste the accessToken.
    Errors follow RFC 7807 (ProblemDetail).
  version: v1
servers:
- url: http://localhost:8080
  description: Generated server url
security:
- bearerAuth: []
tags:
- name: Authentication
  description: Login validation and JWT issuing
- name: Users
  description: "User registration, search, update, password change and soft delete"
paths:
  /api/v1/users/{id}:
    get:
      tags:
      - Users
      summary: Find a user by id
      operationId: findById
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "200":
          description: User found
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/UserResponse"
        "401":
          description: Missing or invalid token
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "404":
          description: User not found
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
    put:
      tags:
      - Users
      summary: Update own profile (password not included)
      operationId: update
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateUserRequest"
        required: true
      responses:
        "200":
          description: User updated
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/UserResponse"
        "400":
          description: Invalid fields
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "401":
          description: Missing or invalid token
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "403":
          description: Users can only modify their own account
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "404":
          description: User not found
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "409":
          description: Email or login already in use
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
    delete:
      tags:
      - Users
      summary: Delete own account (soft delete)
      operationId: delete
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "204":
          description: User deleted
        "401":
          description: Missing or invalid token
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "403":
          description: Users can only modify their own account
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "404":
          description: User not found
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
  /api/v1/users:
    get:
      tags:
      - Users
      summary: Search users by name (paginated)
      operationId: searchByName
      parameters:
      - name: name
        in: query
        required: true
        schema:
          type: string
          minLength: 1
      - name: pageable
        in: query
        required: true
        schema:
          $ref: "#/components/schemas/Pageable"
      responses:
        "200":
          description: Page of users
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/PageResponseUserResponse"
        "400":
          description: Name is blank or sort is invalid
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "401":
          description: Missing or invalid token
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
    post:
      tags:
      - Users
      summary: Register a new user (public)
      operationId: create
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateUserRequest"
        required: true
      responses:
        "201":
          description: User created
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/UserResponse"
        "400":
          description: Invalid fields
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "409":
          description: Email or login already in use
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
      security: []
  /api/v1/auth/login:
    post:
      tags:
      - Authentication
      summary: Validate login and password and return a JWT (public)
      operationId: login
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
        required: true
      responses:
        "200":
          description: "Valid credentials, token issued"
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/LoginResponse"
        "400":
          description: Login or password is blank
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "401":
          description: Invalid login or password
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
      security: []
  /api/v1/users/{id}/password:
    patch:
      tags:
      - Users
      summary: Change own password
      operationId: changePassword
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChangePasswordRequest"
        required: true
      responses:
        "204":
          description: Password changed
        "400":
          description: Invalid fields
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "401":
          description: "Missing or invalid token, or current password is incorrect"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "403":
          description: Users can only modify their own account
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "404":
          description: User not found
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
components:
  schemas:
    AddressRequest:
      type: object
      properties:
        street:
          type: string
          description: Street name
          example: Rua dos Gatos
          maxLength: 150
          minLength: 0
        number:
          type: string
          description: Street number
          example: "123"
          maxLength: 20
          minLength: 0
        city:
          type: string
          description: City name
          example: São Paulo
          maxLength: 100
          minLength: 0
        zipCode:
          type: string
          description: ZIP code
          example: 01310-100
          minLength: 1
          pattern: "\\d{5}-?\\d{3}"
      required:
      - city
      - number
      - street
      - zipCode
    UpdateUserRequest:
      type: object
      properties:
        name:
          type: string
          description: User's full name
          example: John Doe Silva
          maxLength: 150
          minLength: 0
        email:
          type: string
          format: email
          description: User's email address
          example: john.doe@example.com
          maxLength: 255
          minLength: 0
        login:
          type: string
          description: "User's login, 3 to 50 characters"
          example: john.doe
          maxLength: 50
          minLength: 3
        address:
          $ref: "#/components/schemas/AddressRequest"
          description: User's address
      required:
      - address
      - email
      - login
      - name
    ProblemDetail:
      type: object
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
        status:
          type: integer
          format: int32
        detail:
          type: string
        instance:
          type: string
          format: uri
        properties:
          type: object
          additionalProperties: {}
    AddressResponse:
      type: object
      properties:
        street:
          type: string
          description: Street name
          example: Rua dos Gatos
        number:
          type: string
          description: Street number
          example: "123"
        city:
          type: string
          description: City name
          example: São Paulo
        zipCode:
          type: string
          description: ZIP code
          example: 01310-100
    UserResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
          description: User id
          example: 1
        name:
          type: string
          description: User's full name
          example: John Doe
        email:
          type: string
          description: User's email address
          example: john.doe@example.com
        login:
          type: string
          description: User's login
          example: john.doe
        type:
          type: string
          description: User's type
          enum:
          - CUSTOMER
          - RESTAURANT_OWNER
          example: CUSTOMER
        address:
          $ref: "#/components/schemas/AddressResponse"
          description: User's address
        lastModifiedAt:
          type: string
          format: date-time
          description: Last modification date
          example: 2026-11-25T19:30:00
    CreateUserRequest:
      type: object
      properties:
        name:
          type: string
          description: User's full name
          example: John Doe
          maxLength: 150
          minLength: 0
        email:
          type: string
          format: email
          description: User's email address
          example: john.doe@example.com
          maxLength: 255
          minLength: 0
        login:
          type: string
          description: "User's login, 3 to 50 characters"
          example: john.doe
          maxLength: 50
          minLength: 3
        password:
          type: string
          description: "User's password, 8 to 72 characters"
          example: SecurePass123
          maxLength: 72
          minLength: 8
        type:
          type: string
          description: User's type
          enum:
          - CUSTOMER
          - RESTAURANT_OWNER
          example: CUSTOMER
        address:
          $ref: "#/components/schemas/AddressRequest"
          description: User's address
      required:
      - address
      - email
      - login
      - name
      - password
      - type
    LoginRequest:
      type: object
      properties:
        login:
          type: string
          description: User's login
          example: john.doe
          minLength: 1
        password:
          type: string
          description: User's password
          example: SecurePass123
          minLength: 1
      required:
      - login
      - password
    LoginResponse:
      type: object
      properties:
        message:
          type: string
          description: Result message
          example: Login successful.
        accessToken:
          type: string
          description: JWT to send in the Authorization header
          example: eyJhbGciOiJIUzI1NiJ9...
        tokenType:
          type: string
          description: Token type
          example: Bearer
        expiresIn:
          type: integer
          format: int64
          description: Token lifetime in seconds
          example: 3600
        user:
          $ref: "#/components/schemas/UserResponse"
          description: Authenticated user
    ChangePasswordRequest:
      type: object
      properties:
        currentPassword:
          type: string
          description: Current password
          example: SecurePass123
          minLength: 1
        newPassword:
          type: string
          description: "New password, 8 to 72 characters"
          example: NewSecure@456
          maxLength: 72
          minLength: 8
      required:
      - currentPassword
      - newPassword
    Pageable:
      type: object
      properties:
        page:
          type: integer
          format: int32
          minimum: 0
        size:
          type: integer
          format: int32
          minimum: 1
        sort:
          type: array
          items:
            type: string
    PageResponseUserResponse:
      type: object
      properties:
        content:
          type: array
          items:
            $ref: "#/components/schemas/UserResponse"
        page:
          type: integer
          format: int32
        size:
          type: integer
          format: int32
        totalElements:
          type: integer
          format: int64
        totalPages:
          type: integer
          format: int32
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
